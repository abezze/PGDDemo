spring.jpa.hibernate.ddl-auto=create-drop

spring.autoconfigure.exclude=com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration

spring.jpa.show-sql= true

spring.jpa.properties.hibernate.format_sql=true

